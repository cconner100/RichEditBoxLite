name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Validate, pack, and publish
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.nuget.org/packages/CConner100.RichEditBoxLite/${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install package workloads
        run: dotnet workload install android ios wasm-tools

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          project_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/CConner100.RichEditBoxLite/CConner100.RichEditBoxLite.csproj)
          if [[ "$project_version" != "$PACKAGE_VERSION" ]]; then
            echo "Requested version $PACKAGE_VERSION does not match project version $project_version." >&2
            exit 1
          fi

      - name: Run tests
        run: dotnet test RichEditBoxLite.TestApp.Tests/RichEditBoxLite.TestApp.Tests.csproj --configuration Release -p:OverrideTargetFramework=net10.0

      - name: Create package and symbols
        run: dotnet pack src/CConner100.RichEditBoxLite/CConner100.RichEditBoxLite.csproj --configuration Release --output artifacts/packages -p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package contents
        shell: bash
        run: |
          package="artifacts/packages/CConner100.RichEditBoxLite.$PACKAGE_VERSION.nupkg"
          symbols="artifacts/packages/CConner100.RichEditBoxLite.$PACKAGE_VERSION.snupkg"
          test -f "$package"
          test -f "$symbols"
          unzip -t "$package" >/dev/null
          unzip -t "$symbols" >/dev/null
          listing=$(unzip -Z1 "$package")
          for tfm in net10.0 net10.0-android net10.0-ios net10.0-browserwasm net10.0-desktop; do
            grep -q "^lib/$tfm" <<<"$listing" || {
              echo "$package is missing $tfm assets." >&2
              exit 1
            }
          done
          if grep -qE '^(content|contentFiles)/.*(bin|obj)/' <<<"$listing"; then
            echo "$package contains generated build intermediates." >&2
            exit 1
          fi

      - name: Sign in to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: CConner100.RichEditBoxLite-${{ inputs.version }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
