name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-pack:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install workloads required by the multi-target graph
        run: dotnet workload install android ios wasm-tools
      - name: Unit and API coverage tests
        run: dotnet test RichEditBoxLite.TestApp.Tests/RichEditBoxLite.TestApp.Tests.csproj -c Release -p:OverrideTargetFramework=net10.0
      - name: Build Desktop Test UI
        run: dotnet build RichEditBoxLite.TestApp/RichEditBoxLite.TestApp.csproj -f net10.0-desktop -c Release -p:OverrideTargetFramework=net10.0-desktop
      - name: Build WebAssembly Test UI
        run: dotnet build RichEditBoxLite.TestApp/RichEditBoxLite.TestApp.csproj -f net10.0-browserwasm -c Release -p:OverrideTargetFramework=net10.0-browserwasm
      - name: Pack library and symbols
        run: dotnet pack src/CConner100.RichEditBoxLite/CConner100.RichEditBoxLite.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  mobile-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net10.0-android
            runtime_argument: ""
          - framework: net10.0-ios
            runtime_argument: "-r iossimulator-arm64"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install target workload
        run: dotnet workload install android ios
      - name: Build Test UI
        run: dotnet build RichEditBoxLite.TestApp/RichEditBoxLite.TestApp.csproj -f ${{ matrix.framework }} -c Release ${{ matrix.runtime_argument }} -p:OverrideTargetFramework=${{ matrix.framework }} -p:ValidateXcodeVersion=false
